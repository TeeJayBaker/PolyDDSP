# @package _global_
# Portable training settings. Machine-specific roots/devices come from local/default.yaml.
defaults:
  - override /experiment: maestro

device: ${run.devices.maestro}

run:
  fresh: true

experiment:
  dataset:
    root: ${run.data_root}/MAESTRO/maestro-v3.0.0
    pitch_cache_root: ${run.cache_root}/MAESTRO
    pitch_cache_source: ${run.pitch_cache_source}

train:
  steps: 20000
  batch_size: 2
  eval_cheap_every: 500
  eval_full_every: 1000000
