defaults:
  - experiment: guitarset
  - _self_
  - optional local: default
  - override hydra/job_logging: stdout

run:
  data_root: ${oc.env:POLYDDSP_DATA_DIR,/data/polyddsp}
  cache_root: ${oc.env:POLYDDSP_CACHE_DIR,./data/ground-truth}
  devices:
    guitarset: auto
    gaps: auto
    maestro: auto

data_root: ${experiment.dataset.root}
file_glob: ${experiment.dataset.file_glob}
midi_glob: ${experiment.dataset.midi_glob}
n_voices: ${experiment.model.n_voices}
model: basic-pitch     # basic-pitch | neutone-amt-streaming | neutone-amt-nonstreaming | ground-truth
model_path: null       # Neutone Lightning checkpoint or ONNX export
output_dir: null       # null writes beside source audio; otherwise mirrors dataset paths here
apply_sustain: true    # ground truth: extend notes through sustain-pedal intervals
pitch_bend_range: 2.0 # ground truth: semitones represented by full-scale MIDI pitch bend
sample_rate: 16000
hop: 64
min_freq: null
max_freq: null
device: auto           # auto | cpu | cuda | cuda:N
parallel: false
files_per_task: 4      # files processed sequentially per worker, reusing its model (parallel only)
memory_headroom: 2048  # MiB reserved per device by Memex

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
