# @package _global_
experiment:
  name: guitarset
  dataset:
    root: ${run.data_root}/guitarset
    file_glob: "**/*_mix.wav"
    # null keeps the legacy sidecar layout; set this to use a separate cache tree.
    pitch_cache_root: null
    pitch_cache_source: basic-pitch  # basic-pitch | neutone-amt | ground-truth

  model:
    n_voices: 6
    use_z: true
    use_reverb: false
    pitch_source: cached_basic_pitch
  metrics:
    primary: [loudness, multipitch, mss, mfcc, clap, fad]
    multipitch: true
    clap_prompt: "solo acoustic guitar"
