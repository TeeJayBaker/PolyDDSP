# @package _global_
experiment:
  name: guitarset
  dataset:
    root: ${run.data_root}/guitarset/audio_mono-pickup_mix
    file_glob: "**/*_mix.wav"
    midi_glob: "**/*.mid"
    pitch_cache_root: ${run.cache_root}/${run.pitch_cache_source}/guitarset
    pitch_cache_source: ${run.pitch_cache_source}

  model:
    n_voices: 6
    use_z: true
    use_reverb: false
    pitch_source: cached_basic_pitch
  metrics:
    primary: [loudness, multipitch, mss, mfcc, clap, fad]
    multipitch: true
    clap_prompt: "solo acoustic guitar"
