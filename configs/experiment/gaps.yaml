# @package _global_
experiment:
  name: gaps
  dataset:
    root: ${run.data_root}/gaps
    file_glob: "**/*wc.wav"
    midi_glob: "**/*wc.mid"
    pitch_cache_root: ${run.cache_root}/${run.pitch_cache_source}/gaps
    pitch_cache_source: ${run.pitch_cache_source}
  model:
    n_voices: 6
    use_z: true
    use_reverb: false
    pitch_source: cached_basic_pitch
  metrics:
    primary: [loudness, multipitch, mss, mfcc, clap, fad]
    multipitch: true
    clap_prompt: "solo classical guitar"
