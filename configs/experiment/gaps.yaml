# @package _global_
experiment:
  name: gaps
  dataset:
    root: ${run.data_root}/gaps
    file_glob: "**/*wc.wav"
    # null keeps the legacy sidecar layout; set this to use a separate cache tree.
    pitch_cache_root: null
    pitch_cache_backend: basic_pitch  # basic_pitch or neutone
  model:
    n_voices: 6
    use_z: true
    use_reverb: false
    pitch_source: cached_basic_pitch
  metrics:
    primary: [loudness, multipitch, mss, mfcc, clap, fad]
    multipitch: true
    clap_prompt: "solo classical guitar"