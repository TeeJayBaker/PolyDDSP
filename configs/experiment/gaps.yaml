# @package _global_
experiment:
  name: gaps
  dataset:
    root: ${run.data_root}/gaps
    file_glob: "**/*wc.wav"
    midi_glob: "**/*wc.mid"
    # null keeps the legacy sidecar layout; set this to use a separate cache tree.
    pitch_cache_root: null
    pitch_cache_source: basic-pitch  # basic-pitch | neutone-amt-streaming | neutone-amt-nonstreaming | ground-truth
  model:
    n_voices: 6
    use_z: true
    use_reverb: false
  metrics:
    primary: [loudness, multipitch, mss, mfcc, clap, fad]
    multipitch: true
    clap_prompt: "solo classical guitar"
