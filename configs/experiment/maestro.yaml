# @package _global_
experiment:
  name: maestro
  dataset:
    root: ${run.data_root}/MAESTRO/maestro-v3.0.0
    file_glob: "**/*.wav"
    midi_glob: "**/*.midi"
    pitch_cache_root: ${run.cache_root}/${run.pitch_cache_source}/maestro
    pitch_cache_source: ${run.pitch_cache_source}

  model:
    n_voices: 10
    use_z: false
    use_reverb: true
    use_noise: false
    pitch_source: cached_basic_pitch
  metrics:
    primary: [loudness, multipitch, mss, mfcc, clap, fad]
    multipitch: true
    clap_prompt: "solo grand piano"
