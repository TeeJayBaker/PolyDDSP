[project]
name = "polyddsp"
version = "0.1.0"
description = "PolyDDSP — polyphonic extension of DDSP"
license = "MIT"
license-files = ["LICENSE"]
# Hydra 1.3's CLI wrapper is not compatible with Python 3.14's stricter
# argparse help validation. Python 3.13 is the newest verified runtime.
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.11,<2.12",
    "torchaudio>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    "numpy>=2.0",
    "scipy>=1.11",
    "librosa>=0.10",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.16",
    "nnAudio>=0.3",
    "neutone-amt",
    "memex[nvidia]",
    # Keep ONNX Runtime on CUDA 12 alongside PyTorch (1.27 switches to CUDA 13).
    "onnxruntime-gpu>=1.21,<1.27; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime>=1.21,<1.27; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "audio-metrics>=1.0.4",
    "pyarrow>=15.0",
    "resampy>=0.4,<0.5",
    "soundfile>=0.12",
    "tqdm>=4.66",
]

[project.scripts]
polyddsp-preprocess = "polyddsp.preprocess:main"
polyddsp-train = "polyddsp.train:main"
polyddsp-infer = "polyddsp.infer:main"

[dependency-groups]
dev = ["pytest>=8.0"]

# Keep the PyTorch packages on synchronized releases and CUDA builds. The CUDA
# 12.6 wheels support Ampere GPUs; CUDA 12.x minor-version compatibility has a
# Linux driver floor of 525.
[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
neutone-amt = { git = "ssh://git@github.com/hyakuchiki/neutoneAMT.git", branch = "benjie/update-pytorch" }
memex = { git = "https://github.com/bgenchel/Memex.git", rev = "65bb3f07e3a41b9119a82ed43ed96dd1f15db2ae" }

[tool.uv]
# laion-clap 1.1.7 declares numpy<2, but its inference path uses no removed
# NumPy aliases and PolyDDSP's CLAP tests exercise that path under NumPy 2.
override-dependencies = ["numpy>=2.0"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polyddsp", "configs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
