[project]
name = "polyddsp"
version = "0.1.0"
description = "PolyDDSP — polyphonic extension of DDSP"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.5,<2.6",
    "torchaudio>=2.5,<2.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.16",
    "nnAudio>=0.3",
    "audio-metrics>=1.0.4",
    "pyarrow>=15.0",
    "soundfile>=0.12",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# The project targets CUDA 12.1 builds of torch, which on Linux are only
# published on the PyTorch cu121 index. torch 2.5 is the last release with
# cu121 wheels — newer ones only ship cu124+.
[tool.uv.sources]
torch = { index = "pytorch-cu121", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cu121", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polyddsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
